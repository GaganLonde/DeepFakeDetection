[project]
name = "deepfake-detection"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
	"fastapi==0.117.1",
	"uvicorn==0.35.0",
	"python-multipart==0.0.20",
	"tensorflow-cpu==2.16.2",
	"h5py==3.12.1",
	"opencv-python-headless==4.10.0.84",
	"numpy==1.26.4",
]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.vercel.scripts]
build = "npm ci && npm run build"
